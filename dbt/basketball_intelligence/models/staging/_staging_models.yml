version: 2

models:
  - name: stg_player_game_logs
    description: One row per player per game, cleaned and typed.
    columns:
      - name: player_id
        tests: [not_null]
      - name: game_id
        tests: [not_null]
      - name: points
        tests: [not_null]

  - name: stg_team_game_logs
    description: One row per team per game, cleaned and typed.
    columns:
      - name: team_id
        tests: [not_null]
      - name: game_id
        tests: [not_null]

  - name: stg_play_by_play
    description: One row per play-by-play event for ingested games.
    columns:
      - name: game_id
        tests: [not_null]
      - name: action_number
        tests: [not_null]

  - name: stg_players
    description: All-time player dimension.
    columns:
      - name: player_id
        tests: [not_null, unique]

  - name: stg_teams
    description: NBA franchise dimension.
    columns:
      - name: team_id
        tests: [not_null, unique]
      - name: team_abbreviation
        tests: [not_null, unique]

  - name: stg_player_advanced
    description: >
      Official NBA advanced player stats, one row per player per season.
      The league only publishes these from 1996-97, so rows do not exist
      for earlier seasons and the marts derive substitutes from box scores.
    columns:
      - name: season
        tests: [not_null]
      - name: player_id
        tests: [not_null]

  - name: stg_team_advanced
    description: >
      Official NBA advanced team stats, one row per team per season,
      1996-97 onward. Supplies the published ratings that mart_team_season
      prefers over its own box-score estimates.
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]

  - name: stg_schedule
    description: >
      Published schedule including unplayed games, from ScheduleLeagueV2.
      The game-log endpoints only return finished games, so this is the
      only source for a future slate. is_regular_season excludes preseason
      and other non-regular game types from a game_status = 1 slate.
    columns:
      - name: game_id
        tests: [not_null, unique]
      - name: home_team_id
        tests: [not_null]
      - name: away_team_id
        tests: [not_null]
      - name: is_regular_season
        tests: [not_null]

  - name: stg_team_payroll
    description: One row per team per season with total payroll.
    columns:
      - name: season
        tests: [not_null]
      - name: team_abbreviation
        tests: [not_null]
      - name: team_payroll
        description: >
          Null where Basketball-Reference has no salary table for that
          team-season - deliberately NOT not_null tested, see player_count.
      - name: player_count
        description: Salary rows the total was summed from; 0 means no data.
        tests: [not_null]
