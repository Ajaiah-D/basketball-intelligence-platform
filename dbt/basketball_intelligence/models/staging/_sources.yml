version: 2

sources:
  - name: raw
    description: >
      Raw data loaded by scripts/load_to_duckdb.py. Most tables are pulled
      from stats.nba.com via nba_api by ingestion/nba_ingest.py and mirror
      the API responses with original column names - team_payroll is the
      exception, scraped from Basketball-Reference by
      ingestion/team_payroll_ingest.py (see that table's own description).
    schema: raw
    tables:
      - name: player_game_logs
        description: One row per player per game (LeagueGameLog, player mode).
      - name: team_game_logs
        description: One row per team per game (LeagueGameLog, team mode).
      - name: player_advanced
        description: >
          Official advanced player stats per season (LeagueDashPlayerStats,
          Advanced measure type). Only published from 1996-97 on.
      - name: team_advanced
        description: >
          Official advanced team stats per season (LeagueDashTeamStats,
          Advanced measure type). Only published from 1996-97 on.
      - name: play_by_play
        description: One row per play-by-play event (PlayByPlayV3), subset of games.
      - name: players
        description: All-time player index (CommonAllPlayers).
      - name: teams
        description: The 30 NBA franchises (nba_api static data).
      - name: schedule
        description: >
          Full published schedule including unplayed games (ScheduleLeagueV2).
          Re-fetched every run for the current season since postponements and
          rescheduling change it.
      - name: team_payroll
        description: >
          Team payroll totals by season, 1984-85 on, scraped from Basketball-
          Reference by ingestion/team_payroll_ingest.py. One row per team per
          season, for every team active that season. team_payroll is null (never
          0) where the source page has no salary table; player_count records how
          many player rows the total was summed from, so an incomplete season is
          an observed fact rather than something inferred from the cap ratio.
