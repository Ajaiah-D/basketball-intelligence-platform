version: 2

sources:
  - name: raw
    description: >
      Raw data loaded by scripts/load_to_duckdb.py. Most tables are pulled
      from stats.nba.com via nba_api by ingestion/nba_ingest.py and mirror
      the API responses with original column names - team_payroll is the
      exception, scraped from Basketball-Reference by
      ingestion/team_payroll_ingest.py (see that table's own description).
    schema: raw
    tables:
      - name: player_game_logs
        description: One row per player per game (LeagueGameLog, player mode).
      - name: team_game_logs
        description: One row per team per game (LeagueGameLog, team mode).
      - name: player_advanced
        description: >
          Official advanced player stats per season (LeagueDashPlayerStats,
          Advanced measure type). Only published from 1996-97 on.
      - name: team_advanced
        description: >
          Official advanced team stats per season (LeagueDashTeamStats,
          Advanced measure type). Only published from 1996-97 on.
      - name: play_by_play
        description: One row per play-by-play event (PlayByPlayV3), subset of games.
      - name: players
        description: All-time player index (CommonAllPlayers).
      - name: player_bio
        description: >
          Every player ever (PlayerIndex, historical): position, height,
          weight, college, country, draft. Re-fetched every run.
      - name: player_birthdates
        description: >
          Birthdate, school and country per player (CommonPlayerInfo, one
          call per player). Grows a few players a run; the first fill is
          nba_ingest.py --birthdate-backfill.
      - name: player_defend_overall
        description: >
          Defender tracking per season, 2013-14 on (LeagueDashPtDefend,
          Overall, season totals): opponents' shooting with him as the
          closest defender.
      - name: player_defend_rim
        description: >
          Defender tracking within 6 feet per season, 2013-14 on
          (LeagueDashPtDefend, "Less Than 6Ft", season totals).
      - name: player_hustle
        description: >
          Hustle stats per season, 2016-17 on (LeagueHustleStatsPlayer,
          season totals): deflections, contested shots, charges drawn,
          loose balls, box-outs.
      - name: player_on_off
        description: >
          Team defensive rating with each player on and off the floor, per
          team and season, 2007-08 on (TeamPlayerOnOffSummary, season
          totals). One row per team, player and court status (On or Off).
      - name: teams
        description: The 30 NBA franchises (nba_api static data).
      - name: schedule
        description: >
          Full published schedule including unplayed games (ScheduleLeagueV2).
          Re-fetched every run for the current season since postponements and
          rescheduling change it.
      - name: team_payroll
        description: >
          Team payroll totals by season, 1984-85 on, scraped from Basketball-
          Reference by ingestion/team_payroll_ingest.py. One row per team per
          season, for every team active that season. team_payroll is null (never
          0) where the source page has no salary table; player_count records how
          many player rows the total was summed from, so an incomplete season is
          an observed fact rather than something inferred from the cap ratio.
          fetched_at_utc is when the page was scraped (naive UTC).
      - name: team_payroll_players
        description: >
          One row per salary line on a team's Basketball-Reference season page
          (the salaries2 table), 1984-85 on - the rows team_payroll sums,
          written by ingestion/team_payroll_ingest.py from the same fetch.
          Basketball-Reference lists the players a team finished the season
          with plus anyone on 10-day contracts along the way (at the amount
          paid); a traded player appears only on the team he ended with.

  - name: ml
    description: >
      Tables the Python side writes into the warehouse's main schema rather
      than dbt.
    schema: main
    tables:
      - name: predictions
        description: >
          Every game prediction ml/predict.py has published, append-only:
          a game is predicted again by each run until it is played. Rebuilt
          by scripts/load_to_duckdb.py from the committed
          data/predictions/history.csv, which is the source of truth, before
          dbt runs.
