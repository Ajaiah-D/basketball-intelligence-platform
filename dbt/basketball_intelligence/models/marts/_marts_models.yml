version: 2

models:
  - name: mart_player_season
    description: >
      One row per player per season with advanced rate metrics. Derived from
      box scores for every complete season (1985-86 on); official NBA figures
      are used where published (1996-97 on). Metrics that depend on columns
      the source lacks before 1985-86 are null rather than estimated from a
      partial season.
    columns:
      - name: season
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: games_played
        tests: [not_null]
      - name: box_score_complete
        tests: [not_null]

  - name: mart_team_season
    description: >
      One row per team per season: efficiency ratings, pace and the four
      factors. Published NBA ratings where they exist (1996-97 on), box-score
      estimates for 1985-86 to 1995-96, and null before that, since the source
      has no rebound or turnover tracking to estimate from.
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: ratings_source
        tests:
          - not_null
          - accepted_values:
              values:
                - NBA official
                - estimated from box score
                - not available before 1985-86

  - name: fct_team_game
    description: >
      One row per game, oriented home versus away, with margin.
      is_neutral_site is true only when the source data marks both teams as
      away in the matchup string - this catches recent NBA Cup and
      international games but misses the entire 2020 Orlando bubble (88
      games) and pre-2024-25 international games, where the feed still
      assigned a nominal home team. The grain every game-level model
      builds on.
    columns:
      - name: game_id
        tests: [not_null, unique]
      - name: season
        tests: [not_null]
      - name: margin
        tests: [not_null]

  - name: mart_team_standings
    description: >
      One row per team per season: won-loss record, scoring differential, a
      head-to-head tiebreak and the last-five form string. Ordered by
      win_pct, then head-to-head record against the other teams tied on
      win_pct in the same season and conference, then point differential.
      This is a simplification of the NBA's actual tiebreaker rules, not
      an implementation of them - the real rulebook goes on to division
      record, conference record and several further steps not modeled
      here. See the model's own comment for the exact gaps.
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: games_played
        tests: [not_null]

  - name: mart_game_features
    description: >
      One row per game with the features a model may use before tip-off.
      Every rolling window excludes the game's own row, so nothing here
      depends on the result being predicted; margin and home_won are carried
      as targets, never as features. Opening-night games are kept with null
      form rather than dropped, since the cold start is a case the model has
      to handle. Excludes the one no-contest game in the warehouse (a
      cancelled 2013 game recorded as a 0-0 final) from every window. The
      singular test assert_no_future_data_in_features re-derives a sample of
      these values independently rather than trusting the window frames.
    columns:
      - name: game_id
        tests: [not_null, unique]
      - name: season
        tests: [not_null]
      - name: game_date
        tests: [not_null]

  - name: mart_team_finances
    description: >
      One row per team per season: payroll vs. that season's salary cap,
      luxury tax, and (2023-24 on) first/second apron thresholds.
      payroll_likely_incomplete flags team-seasons whose payroll figure
      should not be read as that team's real payroll - usually because
      Basketball-Reference's own source data has real gaps there (verified:
      1984-85, 1986-87 and 1989-90 are all affected; 1984-85 is the single
      largest at 23 flagged rows, and 1989-90 is affected in full).
      payroll_incomplete_reason says which condition actually fired, because
      they do not all mean "the source is missing data" - see that column.
      Consumers should treat source-gap rows as "data not available" rather
      than a literal low payroll.
    columns:
      - name: season
        tests: [not_null]
      - name: team_abbreviation
        tests: [not_null]
      - name: team_payroll
        description: >
          Nullable: 9 team-seasons have no salary table at all in the source.
          Not not_null tested for that reason - use payroll_likely_incomplete
          (or player_count) to decide whether a value is trustworthy.
      - name: player_count
        tests: [not_null]
      - name: salary_cap
        tests: [not_null]
      - name: payroll_likely_incomplete
        tests: [not_null]
      - name: payroll_incomplete_reason
        description: >
          Which payroll_likely_incomplete condition fired. Null exactly when
          payroll_likely_incomplete is false (asserted by
          assert_team_finances_reason_matches_flag).

          'no_source_data' - no salary table on the source page at all
          (player_count 0, payroll null).

          'sparse_source_data' - a salary table exists but is missing most of
          the roster (player_count < 9), or the row is in 1984-85, a
          whole-season source gap. Both mean Basketball-Reference's records
          for that season are incomplete.

          'below_half_cap' - the row count looks complete but the payroll is
          under half that season's cap. Usually also a source gap, but not
          provably one: the only row in the current 1200 reached by this arm
          alone is 1988-89 Miami, a real, complete, genuinely cheap inaugural
          expansion roster. Do not tell a reader the source is missing data
          for a 'below_half_cap' season - say the number is unusually low.
        tests:
          - accepted_values:
              values: ['no_source_data', 'sparse_source_data', 'below_half_cap']
