version: 2

models:
  - name: mart_player_season
    description: >
      One row per player per season: the season line the dashboard shows
      (per-game averages, shooting percentages, true shooting, team and age)
      and advanced rate metrics. The season line covers every ingested
      season. The advanced metrics are derived from box scores for every
      complete season (1985-86 on); official NBA figures are used where
      published (1996-97 on). Metrics that depend on columns the source lacks
      before 1985-86 are null rather than estimated from a partial season.
      Exactly one row per season-player in stg_player_game_logs, with every
      game counted: assert_player_season_matches_game_logs warns on any gap
      and fails the build past 50 rows.
    columns:
      - name: season
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: team_abbreviation
        description: Last team played for. The same value as team.
      - name: games_played
        tests: [not_null]
      - name: minutes
        description: Total minutes played.
      - name: minutes_per_game
        description: &mpg avg(minutes_played), 1 decimal.
      - name: points_per_game
        description: &ppg avg(points), 1 decimal.
      - name: true_shooting_pct
        description: >
          points / (2 x (FGA + 0.44 x FTA)) x 100, 1 decimal. Null when any of
          the player's games that season has a null FGA, FTA or points (sum()
          would otherwise count that game's points with none of its attempts),
          or with no attempts. Not gated on box_score_complete, so it exists
          for most pre-1985-86 player-seasons too.
      - name: plus_minus
        description: avg(plus_minus), 1 decimal. The same value as plus_minus_per_game.
      - name: box_score_complete
        tests: [not_null]
      - name: team
        description: >
          Last team played for, by game date. A date the source logs him for
          two teams goes to the later team code, so it can't change between
          builds.
        tests: [not_null]
      - name: team_label
        description: >
          Every team played for, in order of each stint's first game, joined
          with ' → ' ("CHI → BOS"); a single code for one team. Same tie-break
          as team. The dashboard's team_label; not named team_path because
          the Advanced page merges a team_path of its own onto this mart.
        tests: [not_null]
      - name: rebounds_per_game
        description: &rpg >
          avg(total_rebounds), 1 decimal. Like every per-game average here, it
          skips games where the stat is null rather than counting them as 0.
      - name: assists_per_game
        description: &apg avg(assists), 1 decimal.
      - name: steals_per_game
        description: &spg avg(steals), 1 decimal.
      - name: blocks_per_game
        description: &bpg avg(blocks), 1 decimal.
      - name: threes_made_per_game
        description: &tpg avg(three_pointers_made), 1 decimal.
      - name: fga_per_game
        description: &fga_pg avg(field_goals_attempted), 1 decimal.
      - name: three_pa_per_game
        description: &tpa_pg avg(three_pointers_attempted), 1 decimal.
      - name: fta_per_game
        description: &fta_pg avg(free_throws_attempted), 1 decimal.
      - name: plus_minus_per_game
        description: &pm_pg avg(plus_minus), 1 decimal; null before 1996-97, when the source has none.
      - name: fga_total
        description: &fga_total Total field goal attempts.
      - name: tpa_total
        description: &tpa_total Total three-point attempts.
      - name: fta_total
        description: &fta_total Total free throw attempts.
      - name: fg_pct
        description: &fg_pct >
          Made / attempted field goals x 100, 1 decimal, over the games that
          record both (early seasons often have the makes without the
          attempts, which once put a season over 1000%); null with no
          attempts. fg3_pct and ft_pct are the same for threes and free
          throws. All three are held to 0-100 by
          assert_advanced_metrics_in_range.
      - name: fg3_pct
        description: &fg3_pct Made / attempted threes x 100, as fg_pct.
      - name: ft_pct
        description: &ft_pct Made / attempted free throws x 100, as fg_pct.
      - name: assist_to_turnover
        description: &ast_to Total assists / total turnovers, 2 decimals; null with no turnovers.
      - name: shot_poss
        description: >
          Shooting possessions, FGA + 0.44 x FTA, unrounded. The weight for
          averaging true shooting across seasons.
      - name: age
        description: >
          The NBA's age for the season (stg_player_advanced, 1996-97 on);
          otherwise the player's earliest known age plus the seasons between,
          floored to a whole year. Null for a player with no known age (a
          career that ended before 1996-97).

  - name: mart_player_team_season
    description: >
      One row per player per team per season: the season line from
      mart_player_season over only the games a player played for that team,
      so a player traded mid-season appears on both rosters with his games
      for each. The stints add back up to his mart_player_season row -
      except where assert_player_season_matches_game_logs only warned (a
      player game with no team-log row is in a stint here but missing from
      the season mart). Grain checked by assert_mart_grain_is_unique. Stat
      columns are defined as in mart_player_season, over this stint's games.
    columns:
      - name: season
        description: Season, e.g. 2024-25.
        tests: [not_null]
      - name: player_id
        description: NBA player id.
        tests: [not_null]
      - name: player_name
        description: The player's name that season.
        tests: [not_null]
      - name: team_id
        description: The team this stint was with.
        tests: [not_null]
      - name: team_abbreviation
        description: That team's code that season.
        tests: [not_null]
      - name: first_game
        description: Date of the player's first game for this team that season.
        tests: [not_null]
      - name: games_played
        description: Games played for this team that season.
        tests: [not_null]
      - name: minutes_per_game
        description: *mpg
      - name: points_per_game
        description: *ppg
      - name: rebounds_per_game
        description: *rpg
      - name: assists_per_game
        description: *apg
      - name: steals_per_game
        description: *spg
      - name: blocks_per_game
        description: *bpg
      - name: threes_made_per_game
        description: *tpg
      - name: fga_per_game
        description: *fga_pg
      - name: three_pa_per_game
        description: *tpa_pg
      - name: fta_per_game
        description: *fta_pg
      - name: plus_minus_per_game
        description: *pm_pg
      - name: fga_total
        description: *fga_total
      - name: tpa_total
        description: *tpa_total
      - name: fta_total
        description: *fta_total
      - name: fg_pct
        description: *fg_pct
      - name: fg3_pct
        description: *fg3_pct
      - name: ft_pct
        description: *ft_pct
      - name: true_shooting_pct
        description: >
          points / (2 x (FGA + 0.44 x FTA)) x 100, 1 decimal; null when any
          game in the stint has a null FGA, FTA or points, or with no attempts.
      - name: assist_to_turnover
        description: *ast_to
      - name: shot_poss
        description: Shooting possessions over the stint, FGA + 0.44 x FTA, unrounded.

  - name: mart_player_career
    description: >
      One row per player, pooled across every ingested season, from the
      career's game rows directly rather than by averaging season lines. The
      stat columns are defined as in mart_player_season, computed over the
      whole career - true shooting's null rule included.
    columns:
      - name: player_id
        description: NBA player id.
        tests: [not_null, unique]
      - name: player_name
        description: The most recent spelling (a few players changed theirs).
        tests: [not_null]
      - name: team
        description: Team of the most recent game, same tie-break as mart_player_season.team.
        tests: [not_null]
      - name: seasons
        description: Number of distinct seasons played.
        tests: [not_null]
      - name: first_season
        description: Earliest season with a game.
        tests: [not_null]
      - name: last_season
        description: Most recent season with a game.
        tests: [not_null]
      - name: games_played
        description: Career games.
        tests: [not_null]
      - name: career_high
        description: Most points in a single game.
      - name: pts_total
        description: Career points.
      - name: wins
        description: Games played that his team won.
        tests: [not_null]
      - name: minutes_per_game
        description: *mpg
      - name: points_per_game
        description: *ppg
      - name: rebounds_per_game
        description: *rpg
      - name: assists_per_game
        description: *apg
      - name: steals_per_game
        description: *spg
      - name: blocks_per_game
        description: *bpg
      - name: threes_made_per_game
        description: *tpg
      - name: fga_per_game
        description: *fga_pg
      - name: three_pa_per_game
        description: *tpa_pg
      - name: fta_per_game
        description: *fta_pg
      - name: plus_minus_per_game
        description: *pm_pg
      - name: fga_total
        description: *fga_total
      - name: tpa_total
        description: *tpa_total
      - name: fta_total
        description: *fta_total
      - name: fg_pct
        description: *fg_pct
      - name: fg3_pct
        description: *fg3_pct
      - name: ft_pct
        description: *ft_pct
      - name: true_shooting_pct
        description: >
          points / (2 x (FGA + 0.44 x FTA)) x 100, 1 decimal; null when any
          game in the career has a null FGA, FTA or points, or with no attempts.
      - name: assist_to_turnover
        description: *ast_to
      - name: shot_poss
        description: Shooting possessions over the career, FGA + 0.44 x FTA, unrounded.

  - name: mart_player_game
    description: >
      One row per player per game (the stg_player_game_logs grain): his box
      score line beside the game's result, for the Players page's game log.
      A view, so the published warehouse carries no copy of the game logs.
      Grain checked by assert_player_game_grain_is_unique.
    columns:
      - name: season
        tests: [not_null]
      - name: game_id
        tests: [not_null]
      - name: game_date
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: team_abbreviation
        description: His team in this game.
      - name: opp_team_abbreviation
        description: The opponent's code; from the matchup string when the team logs lack the game.
        tests: [not_null]
      - name: is_away_game
        description: True when the matchup reads "@" (both sides of a neutral-site game do).
      - name: team_points
        description: His team's score. Null only when the team logs lack the game.
      - name: opp_points
        description: The opponent's score, null with team_points.
      - name: true_shooting_pct
        description: >
          points / (2 x (FGA + 0.44 x FTA)) x 100 for this game, 1 decimal;
          null with no attempts or a null input.
      - name: shot_poss
        description: FGA + 0.44 x FTA in this game, the weight for averaging true_shooting_pct.

  - name: mart_league_shooting
    description: >
      One row per season: league-wide FG%, 3P% and FT%, weighted by volume
      (all makes over all attempts, 1 decimal, over the games that record
      both, as in the player marts), null for a season with no attempts of
      that kind. The benchmark for a player's percentages.
    columns:
      - name: season
        description: Season, e.g. 2024-25.
        tests: [not_null, unique]
      - name: fg_pct
        description: League field goal percentage.
      - name: fg3_pct
        description: League three-point percentage.
      - name: ft_pct
        description: League free throw percentage.

  - name: mart_team_season
    description: >
      One row per team per season: efficiency ratings, pace and the four
      factors. Published NBA ratings where they exist (1996-97 on), box-score
      estimates for 1985-86 to 1995-96, and null before that, since the source
      has no rebound or turnover tracking to estimate from.
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: ratings_source
        tests:
          - not_null
          - accepted_values:
              values:
                - NBA official
                - estimated from box score
                - not available before 1985-86

  - name: mart_team_profile
    description: >
      One row per team per season: the team stats the diagnosis views compare
      (all from mart_team_season except the four three-point columns) with
      each stat's league rank and percentile within its season. Rank 1 is the
      best team and percentile 100 is the best (0 the worst), and which end
      of a stat is best is in each column's description. Pace and the
      three-point rates are style stats, where rank 1 means the most, not the
      best. Ties share a rank. A null value has a null rank and percentile,
      and the percentile counts only teams that have the value. Grain checked
      by assert_mart_grain_is_unique; ranks by assert_team_profile_ranks.
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: team_abbreviation
        tests: [not_null]
      - name: offensive_rating
        description: Points scored per 100 possessions.
      - name: offensive_rating_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: offensive_rating_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: defensive_rating
        description: Points allowed per 100 possessions.
      - name: defensive_rating_rank
        description: League rank in the season (1 = lowest value). Lower is better.
      - name: defensive_rating_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: net_rating
        description: Offensive minus defensive rating.
      - name: net_rating_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: net_rating_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: pace
        description: Possessions per 48 minutes. Style, not quality.
      - name: pace_rank
        description: League rank in the season (1 = the most value). Rank 1 = the most, not the best.
      - name: pace_pctile
        description: Percentile 0-100 in the season (100 = the most).
      - name: effective_fg_pct
        description: Effective field goal %, 3-pointers weighted 1.5.
      - name: effective_fg_pct_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: effective_fg_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: turnover_pct
        description: Turnovers per 100 plays.
      - name: turnover_pct_rank
        description: League rank in the season (1 = lowest value). Lower is better.
      - name: turnover_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: offensive_rebound_pct
        description: Share of own misses rebounded.
      - name: offensive_rebound_pct_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: offensive_rebound_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: free_throw_rate
        description: Free throws made per field goal attempt, x100.
      - name: free_throw_rate_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: free_throw_rate_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: assist_pct
        description: Assists per field goal made, x100.
      - name: assist_pct_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: assist_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: opp_effective_fg_pct
        description: Opponent effective field goal %.
      - name: opp_effective_fg_pct_rank
        description: League rank in the season (1 = lowest value). Lower is better.
      - name: opp_effective_fg_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: opp_turnover_pct
        description: Opponent turnovers per 100 plays (turnovers forced).
      - name: opp_turnover_pct_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: opp_turnover_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: defensive_rebound_pct
        description: Share of opponent misses rebounded.
      - name: defensive_rebound_pct_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: defensive_rebound_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: opp_free_throw_rate
        description: Opponent free throws made per field goal attempt, x100.
      - name: opp_free_throw_rate_rank
        description: League rank in the season (1 = lowest value). Lower is better.
      - name: opp_free_throw_rate_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: three_pt_pct
        description: Team 3PM / 3PA x 100. Null when any game that season lacks either.
      - name: three_pt_pct_rank
        description: League rank in the season (1 = highest value). Higher is better.
      - name: three_pt_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: three_pt_rate
        description: 3PA / FGA x 100. Style, not quality.
      - name: three_pt_rate_rank
        description: League rank in the season (1 = the most value). Rank 1 = the most, not the best.
      - name: three_pt_rate_pctile
        description: Percentile 0-100 in the season (100 = the most).
      - name: opp_three_pt_pct
        description: Opponent 3PM / 3PA x 100.
      - name: opp_three_pt_pct_rank
        description: League rank in the season (1 = lowest value). Lower is better.
      - name: opp_three_pt_pct_pctile
        description: Percentile 0-100 in the season (100 = best).
      - name: opp_three_pt_rate
        description: Opponent 3PA / FGA x 100. Style, not quality.
      - name: opp_three_pt_rate_rank
        description: League rank in the season (1 = the most value). Rank 1 = the most, not the best.
      - name: opp_three_pt_rate_pctile
        description: Percentile 0-100 in the season (100 = the most).

  - name: mart_player_percentiles
    description: >
      One row per player per season: the stats the player scatter and compare
      views grade (all from mart_player_season) with each one's percentile
      among that season's qualified players, 100 = best. Qualified follows
      dashboard/lib/stats.py::qualification_threshold: 60% of the season's
      most games played (rounded down), at least 1 and at most 25. Players
      below it keep their row and values with null percentiles and
      is_qualified false. Turnover rate is graded the other way (lower is
      better). Grain checked by assert_mart_grain_is_unique; percentile
      direction and range by assert_player_percentiles.
    columns:
      - name: season
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: player_name
        tests: [not_null]
      - name: team_abbreviation
        description: Last team played for that season.
      - name: team_label
        description: Every team he played for that season, joined with an arrow when traded.
      - name: games_played
      - name: minutes
        description: Total minutes played.
      - name: qualification_games
        description: The season's minimum games to qualify.
        tests: [not_null]
      - name: is_qualified
        description: games_played >= qualification_games.
        tests: [not_null]
      - name: points_per_game
        description: Points per game. As in mart_player_season.
      - name: points_per_game_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: true_shooting_pct
        description: True shooting %. As in mart_player_season.
      - name: true_shooting_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: rebounds_per_game
        description: Rebounds per game. As in mart_player_season.
      - name: rebounds_per_game_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: assists_per_game
        description: Assists per game. As in mart_player_season.
      - name: assists_per_game_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: steals_per_game
        description: Steals per game. As in mart_player_season.
      - name: steals_per_game_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: blocks_per_game
        description: Blocks per game. As in mart_player_season.
      - name: blocks_per_game_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: threes_made_per_game
        description: Three-pointers made per game. As in mart_player_season.
      - name: threes_made_per_game_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: turnover_pct
        description: Turnovers per 100 of his own possessions that end in a shot, free throw or turnover. As in mart_player_season.
      - name: turnover_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Lower is better, so the lowest value is percentile 100. Null when not qualified or the stat is null.
      - name: usage_pct
        description: Share of team possessions he ends while on the floor. As in mart_player_season.
      - name: usage_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: assist_pct
        description: Share of teammates' field goals he assists while on the floor. As in mart_player_season.
      - name: assist_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: rebound_pct
        description: Share of available rebounds he grabs while on the floor. As in mart_player_season.
      - name: rebound_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: offensive_rebound_pct
        description: Share of available offensive rebounds he grabs while on the floor. As in mart_player_season.
      - name: offensive_rebound_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: defensive_rebound_pct
        description: Share of available defensive rebounds he grabs while on the floor. As in mart_player_season.
      - name: defensive_rebound_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: steal_pct
        description: Steals per 100 opponent possessions while on the floor. As in mart_player_season.
      - name: steal_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: block_pct
        description: Share of opponent two-point attempts he blocks while on the floor. As in mart_player_season.
      - name: block_pct_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.
      - name: free_throw_rate
        description: Free throw attempts per field goal attempt. As in mart_player_season.
      - name: free_throw_rate_pctile
        description: >
          Percentile 0-100 among the season's qualified players with a value (100 = best). Higher is better. Null when not qualified or the stat is null.

  - name: mart_player_defense
    description: >
      One row per player per season: an estimated defensive on/off and how
      often he fouls. The off-court rating is backed out of two published
      numbers - the team's defensive rating over all its minutes and the
      player's official on-court defensive rating - weighted by the share of
      the team's 48-minute games he played. An estimate, not a lineup-based
      on/off. The on/off columns (est_off_court_def_rating, def_on_minus_off)
      are null unless he played for one team all season, 500+ minutes, in
      1996-97 or later, with a minutes share under 0.95 (checked by
      assert_player_defense_on_off_rules). fouls_per_36 is null below 100
      minutes. Grain checked by assert_mart_grain_is_unique; the 0-15 range of
      fouls_per_36 by assert_player_defense_on_off_rules.
    columns:
      - name: season
        tests: [not_null]
      - name: player_id
        tests: [not_null]
      - name: player_name
      - name: team_abbreviation
        description: Last team played for that season.
      - name: minutes
        description: Total minutes played.
      - name: games_played
      - name: on_court_def_rating
        description: His official defensive rating (points allowed per 100 possessions while on the floor). Null before 1996-97.
      - name: team_def_rating
        description: The team's defensive rating over the season (mart_team_season).
      - name: team_games
        description: Games the team played that season.
      - name: minutes_share
        description: minutes / (team_games x 48).
      - name: est_off_court_def_rating
        description: (team_def_rating - minutes_share x on_court_def_rating) / (1 - minutes_share). Null unless the on/off rules hold.
      - name: def_on_minus_off
        description: on_court_def_rating - est_off_court_def_rating. Negative means the team defended better with him on the floor. Null unless the on/off rules hold.
      - name: fouls_per_36
        description: Personal fouls per 36 minutes, from the game logs. Null below 100 minutes.

  - name: fct_team_game
    description: >
      One row per game, oriented home versus away, with margin.
      is_neutral_site is true only when the source data marks both teams as
      away in the matchup string - this catches recent NBA Cup and
      international games but misses the entire 2020 Orlando bubble (88
      games) and pre-2024-25 international games, where the feed still
      assigned a nominal home team. The grain every game-level model
      builds on.
    columns:
      - name: game_id
        tests: [not_null, unique]
      - name: season
        tests: [not_null]
      - name: margin
        tests: [not_null]

  - name: mart_team_standings
    description: >
      One row per team per season: won-loss record, scoring differential, a
      head-to-head tiebreak and the last-five form string. Ordered by
      win_pct, then head-to-head record against the other teams tied on
      win_pct in the same season and conference, then point differential.
      This is a simplification of the NBA's actual tiebreaker rules, not
      an implementation of them - the real rulebook goes on to division
      record, conference record and several further steps not modeled
      here. See the model's own comment for the exact gaps.
    columns:
      - name: season
        tests: [not_null]
      - name: team_id
        tests: [not_null]
      - name: team_name
        tests: [not_null]
      - name: conference
        description: From the team_codes seed; null (and a failed build) for a code it doesn't cover.
        tests: [not_null]
      - name: games_played
        tests: [not_null]

  - name: mart_game_features
    description: >
      One row per game with the features a model may use before tip-off.
      Every rolling window excludes the game's own row, so nothing here
      depends on the result being predicted; margin and home_won are carried
      as targets, never as features. Opening-night games are kept with null
      form rather than dropped, since the cold start is a case the model has
      to handle. Excludes the one no-contest game in the warehouse (a
      cancelled 2013 game recorded as a 0-0 final) from every window. The
      singular test assert_no_future_data_in_features re-derives a sample of
      these values independently rather than trusting the window frames.
    columns:
      - name: game_id
        tests: [not_null, unique]
      - name: season
        tests: [not_null]
      - name: game_date
        tests: [not_null]

  - name: mart_team_finances
    description: >
      One row per team per season: payroll vs. that season's salary cap,
      luxury tax, and (2023-24 on) first/second apron thresholds.
      payroll_likely_incomplete flags team-seasons whose payroll figure
      should not be read as that team's real payroll - usually because
      Basketball-Reference's own source data has real gaps there (verified:
      1984-85, 1986-87 and 1989-90 are all affected; 1984-85 is the single
      largest at 23 flagged rows, and 1989-90 is affected in full).
      payroll_incomplete_reason says which condition actually fired, because
      they do not all mean "the source is missing data" - see that column.
      Consumers should treat source-gap rows as "data not available" rather
      than a literal low payroll.
    columns:
      - name: season
        tests: [not_null]
      - name: team_abbreviation
        tests: [not_null]
      - name: team_payroll
        description: >
          Nullable: 9 team-seasons have no salary table at all in the source.
          Not not_null tested for that reason - use payroll_likely_incomplete
          (or player_count) to decide whether a value is trustworthy.
      - name: player_count
        tests: [not_null]
      - name: payroll_fetched_at_utc
        description: When this team-season's salary page was last scraped (naive UTC).
      - name: salary_cap
        tests: [not_null]
      - name: payroll_likely_incomplete
        tests: [not_null]
      - name: payroll_incomplete_reason
        description: >
          Which payroll_likely_incomplete condition fired. Null exactly when
          payroll_likely_incomplete is false (asserted by
          assert_team_finances_reason_matches_flag).

          'no_source_data' - no salary table on the source page at all
          (player_count 0, payroll null).

          'sparse_source_data' - a salary table exists but is missing most of
          the roster (player_count < 9), or the row is in 1984-85, a
          whole-season source gap. Both mean Basketball-Reference's records
          for that season are incomplete.

          'below_half_cap' - the row count looks complete but the payroll is
          under half that season's cap. Usually also a source gap, but not
          provably one: the only row in the current 1200 reached by this arm
          alone is 1988-89 Miami, a real, complete, genuinely cheap inaugural
          expansion roster. Do not tell a reader the source is missing data
          for a 'below_half_cap' season - say the number is unusually low.
        tests:
          - accepted_values:
              values: ['no_source_data', 'sparse_source_data', 'below_half_cap']

  - name: mart_team_contracts
    description: >
      One row per player per team-season: salary paid by that team, its rank
      on the team's payroll (1 = biggest) and its share of the payroll.
      Sums to mart_team_finances.team_payroll for every team-season with
      player rows (see assert_team_contracts_sum_to_payroll).
    columns:
      - name: season
        tests: [not_null]
      - name: team_abbreviation
        tests: [not_null]
      - name: bbref_player_id
        tests: [not_null]
      - name: player
        tests: [not_null]
      - name: salary_usd
        tests: [not_null]
      - name: salary_rank
        tests: [not_null]

  - name: mart_settled_predictions
    description: >
      One row per played game that has a prediction: the earliest
      prediction for it (later re-runs are never graded) beside the result
      from fct_team_game. The no-contest 0-0 game is left out. A view, so it
      always reflects the predictions ml/predict.py appended after dbt ran;
      ml/evaluate.py scores it. Empty before the season's first result, and
      when main.predictions does not exist yet.
    columns:
      - name: game_id
        tests: [not_null, unique]
      - name: win_probability
        tests: [not_null]
      - name: home_won
        tests: [not_null]
