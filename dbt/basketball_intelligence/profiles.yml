# Local profile checked into the repo (no secrets - it's a local file path).
# Run dbt from this directory with:  dbt run --profiles-dir .
basketball_intelligence:
  target: dev
  outputs:
    dev:
      type: duckdb
      # BIP_WAREHOUSE (set by the weekly refresh for its child processes)
      # picks the file; the default is relative to this directory
      # (dbt/basketball_intelligence/).
      path: "{{ env_var('BIP_WAREHOUSE', '../../warehouse/basketball.duckdb') }}"
      threads: 4
