# Mirrors the tokens in dashboard/lib/theme.py that Streamlit's own widgets
# use (page, surface, ink, brand): change a colour there and here together.
# tests/test_theme.py checks the two agree.
[theme]
base = "dark"
primaryColor = "#f08a3c"
backgroundColor = "#1d232c"
secondaryBackgroundColor = "#262d38"
textColor = "#f1f4f8"
font = "sans serif"
# Sharp corners on native widgets (buttons, inputs, tabs, expanders) to match
# dashboard/lib/theme.py's RADIUS token used on custom cards/chips - without
# this, native widgets keep Streamlit's default ~8px rounding and the site
# looks half-flattened.
baseRadius = "2px"
buttonRadius = "2px"
# Table chrome. The grid draws its cells into a <canvas>, so these are the
# only hooks that reach it - CSS in theme.py cannot style dataframe cells.
dataframeHeaderBackgroundColor = "#2f3744"
dataframeBorderColor = "#353e4b"

[browser]
gatherUsageStats = false
