[theme]
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#ffffff"
font = "sans serif"
# Sharp corners on native widgets (buttons, inputs, tabs, expanders) to match
# dashboard/lib/theme.py's RADIUS token used on custom cards/chips - without
# this, native widgets keep Streamlit's default ~8px rounding and the site
# looks half-flattened.
baseRadius = "2px"
buttonRadius = "2px"
# Table chrome. The grid draws its cells into a <canvas>, so these are the
# only hooks that reach it - CSS in theme.py cannot style dataframe cells.
dataframeHeaderBackgroundColor = "#232322"
dataframeBorderColor = "#2c2c2a"

[browser]
gatherUsageStats = false
