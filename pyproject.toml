# Tool configuration only: this is an application, not an installable package,
# so there is no build backend.
[project]
name = "basketball-intelligence-platform"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["dbt/**/target", ".venv", ".superpowers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4"]
# RUF001-003: the code intentionally uses arrows, middle dots and accented
# player names. E501: the formatter owns line length.
# N812: `from . import theme as T` is the project-wide alias for the theme
# tokens, used in every view.
ignore = ["RUF001", "RUF002", "RUF003", "E501", "N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "PTH"]
# E402: these put the repo root on sys.path before importing from it - the
# app because `streamlit run dashboard/app.py` puts only dashboard/ there, the
# ingesters and scripts because they run as `python <folder>/<file>.py`, and
# conftest because it is what puts the root on the path for the tests.
"dashboard/app.py" = ["E402"]
"ingestion/nba_ingest.py" = ["E402"]
"ingestion/team_payroll_ingest.py" = ["E402"]
"scripts/backfill_team_payroll.py" = ["E402"]
"scripts/health_check.py" = ["E402"]
"scripts/load_to_duckdb.py" = ["E402"]
"scripts/weekly_refresh.py" = ["E402"]
"scripts/write_metadata.py" = ["E402"]
"tests/conftest.py" = ["E402"]
# sklearn convention: X is the feature matrix, so N803/N806 do not apply.
"ml/**" = ["N803", "N806"]
"tests/test_train.py" = ["N803"]

[tool.ruff.format]
quote-style = "double"
# ruff 0.17 also reformats python code blocks inside markdown; keep the docs
# and plans as written.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
# Gradual typing: unannotated functions are still checked, but nothing is
# forced to carry annotations.
files = ["core", "dashboard", "ingestion", "ml", "scripts"]
# dashboard/, dashboard/lib/, ingestion/ and scripts/ have no __init__.py;
# resolve their modules from the repo root, the way the app imports them.
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "full_warehouse: needs the full local warehouse (all seasons); deselected in CI",
]
addopts = "-ra"
