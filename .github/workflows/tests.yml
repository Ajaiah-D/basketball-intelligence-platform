name: Tests

# Lint, then dbt build + pytest against committed parquet fixtures. No live API
# calls: stats.nba.com blocks GitHub-hosted runners' IPs (confirmed by a
# failed test run - see DEPLOYMENT.md), so ingestion/nba_ingest.py never
# runs here. Real data refreshes stay a local, residential-IP job.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          mypy

      - name: Build a warehouse from the committed fixtures
        run: |
          mkdir -p data/raw
          cp -r data/fixtures/* data/raw/
          python scripts/load_to_duckdb.py

      - name: dbt build
        working-directory: dbt/basketball_intelligence
        run: dbt build --profiles-dir .

      # The fixtures hold a handful of seasons, so tests that need the full
      # warehouse are deselected; conftest.py fails the run on any skip.
      - name: pytest
        run: pytest -m "not full_warehouse" -v --tb=short
